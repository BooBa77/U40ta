services:
  frontend:
    image: ghcr.io/booba77/u40ta-frontend:latest
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  backend:
    image: ghcr.io/booba77/u40ta-backend:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      # Рантайм приложения: роль u40ta_app — только DML, прав на схему нет.
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      # Миграции: отдельная роль u40ta_migrator с правом на DDL.
      # Нужна только командам migration:*, но data-source.ts читает её из того же
      # окружения контейнера. См. docs/u40ta/DATABASE.md.
      - MIGRATION_DB_USERNAME=${MIGRATION_DB_USERNAME}
      - MIGRATION_DB_PASSWORD=${MIGRATION_DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      # TELEGRAM_BOT_TOKEN убран 12.10.2026: Telegram в РФ заблокирован,
      # авторизации через него в коде нет. См. docs/u40ta/AUDIT.md, находка 7.
      - EMAIL_IMAP_USER=${EMAIL_IMAP_USER}
      - EMAIL_IMAP_PASSWORD=${EMAIL_IMAP_PASSWORD}
      - EMAIL_IMAP_HOST=${EMAIL_IMAP_HOST}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT}
      - EMAIL_IMAP_TLS=${EMAIL_IMAP_TLS}
      - EMAIL_SMTP_USER=${EMAIL_SMTP_USER}
      - EMAIL_SMTP_PASSWORD=${EMAIL_SMTP_PASSWORD}
      - EMAIL_SMTP_HOST=${EMAIL_SMTP_HOST}
      - EMAIL_SMTP_PORT=${EMAIL_SMTP_PORT}
      - EMAIL_SMTP_SECURE=${EMAIL_SMTP_SECURE}
      - EMAIL_SMTP_FROM=${EMAIL_SMTP_FROM}
      - EMAIL_ATTACHMENTS_PATH=${EMAIL_ATTACHMENTS_PATH}
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      # POSTGRES_* образ читает только при первой инициализации тома.
      # После разделения ролей владелец базы называется u40ta_owner.
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
